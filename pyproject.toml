[project]
name = "wally"
version = "2.0.0"
description = "Company knowledge assistant: retrieval-augmented answers with citations, streaming, reranking and live metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "groq>=1.7.0",
    "pypdf>=6.21.2",
    "inngest>=0.5.19",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]
