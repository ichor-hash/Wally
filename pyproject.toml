[project]
name = "ethan"
version = "3.1.0"
description = "Company knowledge assistant: hybrid and contextual retrieval, reranking, corrective search, agent tools, verified cited answers, OpenUI charts and cost tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "groq>=1.7.0",
    "pypdf>=6.21.2",
    "requests>=2.34.2",
]

[project.optional-dependencies]
events = ["inngest>=0.5.19"]
dev = ["pytest>=9.1", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
