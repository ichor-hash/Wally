name: Answer evaluation

# Generates real answers with the LLM and grades them. Costs tokens, so it only runs on
# demand. Needs a repository secret named GROQ_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      configs:
        description: Retrieval configurations to grade answers for
        default: baseline-v2,hybrid+rerank

jobs:
  answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (CPU PyTorch)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Generate and grade answers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COMPANY_NAME: Apple Inc.
        run: python evals/run_evals.py --answers --answer-configs "${{ inputs.configs }}"
      - uses: actions/upload-artifact@v4
        with:
          name: answer-eval-report
          path: evals/results/
